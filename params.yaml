project:
  name: "sherlock"
  version: "0.2.0"
  language: "fr"

paths:
  data_dir: "data"
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  models_dir: "models"
  reports_dir: "reports"
  logs_dir: "logs"

io:
  separator: "|"
  encoding: "utf-8"

parties:
  - "EELV"
  - "LFI"
  - "LR"
  - "PCF"
  - "PS"
  - "Reconquête"
  - "Renaissance"
  - "RN"

cleaning:
  min_words: 3
  min_words_strict: 5
  chunk_size: 120
  mention_token: "__MENTION__"

balance:
  per_party: 1392
  seed: 42

split:
  train: 0.8
  val: 0.1
  test: 0.1
  seed: 42

model:
  # Mêmes hyperparamètres que le run historique V6 (F1 macro 0,629 sur test)
  name: "almanach/camembert-base"
  max_length: 512
  batch_size: 16
  learning_rate: 2.0e-5
  weight_decay: 0.0
  epochs: 4
  warmup_ratio: 0.0
  early_stopping_patience: 2
  seed: 92
  fp16: true
  # Préfixe "[NOIRONY] [SENT_négatif] texte..." (sentiment + ironie en entrée)
  use_meta: true

legacy:
  # Splits du projet de fin d'études (source de vérité, jamais modifiés)
  splits_dir: "data/raw/legacy"

mlflow:
  experiment: "sherlock-party-classification"
  tracking_uri: "sqlite:///mlflow.db"
