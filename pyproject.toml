[project]
name = "sherlock"
version = "0.1.0"
description = "French political ideology classifier with multi-task NLP (party, sentiment, irony)"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Lilian Doublet" }
]
license = { text = "MIT" }
keywords = ["nlp", "french", "political-science", "camembert", "classification"]

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.9",
]

[project.optional-dependencies]
data = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pandera>=0.20",
    "ftfy>=6.3",
    "emoji>=2.14",
    "langdetect>=1.0.9",
    "tqdm>=4.66",
    "scikit-learn>=1.5",
]
scraping = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "tenacity>=9.0",
    "aiohttp>=3.10",
]
llm = [
    "google-genai>=1.0",
    "anthropic>=0.39",
]
ml = [
    "torch>=2.5",
    "transformers>=4.46",
    "datasets>=3.0",
    "accelerate>=1.0",
    "mlflow>=2.17",
]
viz = [
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.24",
]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pre-commit>=4.0",
    "ipykernel>=6.29",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --cov=sherlock --cov-report=term-missing"

[project.scripts]
sherlock = "sherlock.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sherlock"]