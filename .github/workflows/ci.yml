name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Réutilisé par release.yml : aucune release sans CI verte
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies (torch CPU)
        # torch CPU évite ~3 Go de CUDA inutiles en CI ; les tests modèle tournent vraiment
        run: |
          uv sync --locked --extra data --extra scraping --extra llm --extra viz --extra demo --extra dev
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install "transformers>=4.46" "mlflow>=2.17" "sentencepiece>=0.2" "protobuf>=5.28" "accelerate>=1.0" "datasets>=3.0"

      - name: Lint with ruff
        run: |
          uv run --no-sync ruff check src tests app
          uv run --no-sync ruff format --check src tests app

      - name: Run tests
        run: uv run --no-sync pytest tests/ --tb=short
        env:
          GEMINI_API_KEY: "dummy-key-for-tests"
          ANTHROPIC_API_KEY: "dummy-key-for-tests"
